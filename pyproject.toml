[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwmanager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["argon2-cffi", "cryptography", "pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "vault", "shell", "errors", "validation", "setup_logging", "cipher", "kdf", "vault_file"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pwmanager = "main:main"

[tool.pytest.ini_options]
markers = ["slow: uses production Argon2 parameters"]